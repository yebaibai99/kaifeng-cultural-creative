server:
  port: 8082 #8080

spring:
  application:
    name: wenchuang-shop
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/wenchuang_shop?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASS:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.type.preferred_enum_jdbc_type: VARCHAR
  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  jwt:
    issuer: wenchuang-shop
    secret: ${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET}
    accessTokenMinutes: 240
  upload:
    dir: C:/Users/15897/Desktop/wenchuang/Project/backend-spring/data/uploads